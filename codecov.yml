# EN: Codecov configuration for ElRoso.ARCA.
# ES: Configuración de Codecov para ElRoso.ARCA.
# Docs: https://docs.codecov.com/docs/codecovyml-reference

coverage:
  precision: 2
  round: down
  range: "25...80"

  status:
    # EN: Project-wide coverage gate. Lenient threshold while we grow the suite.
    # ES: Gate de cobertura global. Threshold suave mientras crece la suite.
    project:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error

    # EN: Coverage delta for new code in a PR. Stricter — new code should be well-tested.
    # ES: Delta de cobertura del código nuevo en un PR. Más estricto — código nuevo debe testearse.
    patch:
      default:
        target: 60%
        threshold: 5%
        if_ci_failed: error

# EN: Files excluded from coverage analysis.
# ES: Archivos excluidos del análisis de cobertura.
ignore:
  - "ARCA/Connected Services/**"   # autogenerated SOAP proxies (WSAA/WSFEv1/WSFEXv1/Padron)
  - "**/Reference.cs"              # generated WCF proxy references
  - "ARCA/Properties/**"           # AssemblyAttributes marker file
  - "tests/**"                     # test code itself
  - "samples/**"                   # samples are not production code

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# EN: PR check requirements — block merge if patch coverage drops too much.
# ES: Requisitos de check del PR — bloquea merge si la cobertura del patch baja demasiado.
github_checks:
  annotations: true
